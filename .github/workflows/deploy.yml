name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Crash gate — runs BEFORE the build so a runtime-breaking deploy never
      # reaches Pages. `vite build` does not resolve identifiers, so a
      # ReferenceError compiles clean and deploys green (this happened: 9f71f61
      # crashed the Live runner on Mic Mode). See eslint.crash.config.js — it is
      # a small, must-be-zero rule set, NOT the ~218-message style baseline.
      - run: npm run lint:crash
      # Unit tests on pure logic. These cover the functions whose failures are
      # SILENT — a miscategorised class type, a lost movement alias, a slide quietly
      # dropped before extraction. Manual testing cannot surface any of them.
      - run: npm test
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # OAuth CLIENT ID (not a secret — it ships in every OAuth web app's
          # bundle by design). Dedicated Slides-import Cloud project, consent
          # screen in Testing mode; scopes are read-only Slides + Drive.
          VITE_GOOGLE_SLIDES_CLIENT_ID: 752012094269-2egmufghtkmoiem8r923edublm4i4n3o.apps.googleusercontent.com
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
